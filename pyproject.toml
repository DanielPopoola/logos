[project]
name = "logos"
version = "0.1.0"
description = "Gospel message knowledge base system"
readme = "README.md"
authors = [
    { name = "Daniel Popoola", email = "iamuchihadaniel236@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uuid6>=2025.0.1",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
logos = "logos:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude=["versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty]
# defaults are fine to start; tune later if it gets noisy

[tool.pytest.ini_options]
markers = [
    "slow: real network calls (YouTube, Gemini) — excluded from default CI run",
]
